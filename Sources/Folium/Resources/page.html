<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!--
  Enforces CONTEXT.md's no-network floor: Folium originates no network
  request, by policy engine rather than convention. No directive here uses
  `'self'`: measured against this exact shell, `'self'` matched this page's
  own `file://` origin loosely enough that a cross-origin remote image or
  stylesheet still loaded — CSP's `'self'` keyword did not fence off a
  remote scheme the way it would on a page actually served over the network.
  The unquoted scheme-source `file:` (not the quoted string `'file:'`, which
  is a different, invalid expression that matches nothing) restricts every
  directive to `file://` URLs specifically, and still permits this page's
  own local assets under loadFileURL's read-access grant. Verified in
  `ContentSecurityPolicyTests.swift`: a remote image and a remote stylesheet
  link are both blocked, with a `securitypolicyviolation` recorded for each,
  while the bundled highlight.js and both local stylesheets still load.
  `base-uri 'none'` is separately deliberate — issue #18 rewrites relative
  document-relative URLs in Swift rather than injecting a <base> tag; leave
  this here so that approach can't quietly regress to the tag-based one.
  Placed before the asset tags below so nothing in <head> loads unpoliced.

  `img-src`/`media-src` also allow the private `folium-doc:` scheme
  (issue #18): a document's own images and media load through
  `DocumentResourceSchemeHandler`, which reads the bytes on the app's
  process rather than granting the web content process any filesystem
  access. `folium-doc:` is not added to `script-src`/`style-src` — nothing
  a rendered document references is ever executed or cascaded as code.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file:; img-src file: folium-doc:; font-src file:; media-src file: folium-doc:; base-uri 'none'; form-action 'none';">
<link rel="stylesheet" href="github.css">
<link rel="stylesheet" href="../HighlightJS/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="../HighlightJS/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="code-block.css">
<script src="../HighlightJS/highlight.min.js"></script>
<script src="code-block.js"></script>
<script src="scroll.js"></script>
</head>
<body>
<article class="markdown-body" id="markdown-content"></article>
</body>
</html>
