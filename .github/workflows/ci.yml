name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          # The bundle step derives CFBundleVersion from the commit count,
          # which a shallow checkout cannot count.
          fetch-depth: 0

      # Package.swift is swift-tools-version 6.0, which needs Xcode 16+.
      # Select the newest Xcode present rather than hard-coding a point version.
      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi

      - name: Show toolchain
        run: swift --version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Runs lint, vet, unit tests, integration tests, and the coverage gate.
      - name: make check
        run: make check

      # The shippability gate: assemble the real universal, ad-hoc-signed
      # bundle and assert its finished shape. See scripts/verify-bundle.sh.
      - name: make bundle && make verify-bundle
        run: make bundle && make verify-bundle

      # Informational only, never a gate: wall-clock numbers from a shared
      # runner measure the runner, and a gate that fails randomly trains
      # everyone to ignore it (issue #21, CONTEXT.md's perceived-latency
      # priority). `make bench` exits 0 whether or not a budget is met, so
      # continue-on-error covers only the recipe failing outright.
      #
      # Expect the paint-dependent lines to read "not measured" here: those
      # wait on requestAnimationFrame, which needs a window on screen, and a
      # runner has no attached display session. The render timing, and the
      # record that the recipe still runs, are what this step is for.
      - name: make bench
        continue-on-error: true
        run: make bench 2>&1 | tee bench-results.txt

      - name: Upload bench results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results.txt
          if-no-files-found: warn
